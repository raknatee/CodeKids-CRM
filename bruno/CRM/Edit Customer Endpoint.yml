          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/backend/customer"
      method: PUT
      params:
        - name: uid
          value: not-exist-uid
          type: query
      body:
        type: json
        data: |-
          {
            "first_name": ""
          }
    response:
      status: 404
      statusText: Not Found
