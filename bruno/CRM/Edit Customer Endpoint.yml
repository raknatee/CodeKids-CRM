info:
  name: Edit Customer Endpoint
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/backend/customer?uid=e4e5504b-c2f9-4699-ac07-098fd48c08dd"
  params:
    - name: uid
      value: e4e5504b-c2f9-4699-ac07-098fd48c08dd
      type: query
  body:
    type: json
    data: |-
      {
        "codekids_id": "",
        "first_name": "{{customer_firstname}}",
        "last_name": "{{customer_lastname}}",
        "nickname": "",
        "dob": "2026-08-24T08:26:37.964Z",
        "email": "",
        "phone": "",
        "district": "",
        "city": "",
        "education": "",
        "workplace": "",
        "lead_status": "NEW_LEAD",
        "experience": null,
        "notes": "",
        "why_codekids": ""
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/backend/customer"
      method: PUT
      params:
        - name: uid
          value: ""
          type: query
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "lead_status": "NEW_LEAD"
          }
    response:
      status: 200
      statusText: OK
      headers:
