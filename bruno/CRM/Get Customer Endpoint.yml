info:
  name: Get Customer Endpoint
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/backend/customer?uid=e4e5504b-c2f9-4699-ac07-098fd48c08dd"
  params:
    - name: uid
      value: e4e5504b-c2f9-4699-ac07-098fd48c08dd
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

