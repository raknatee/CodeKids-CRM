info:
  name: Get ContactSession Endpoint
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/backend/contact-session?session_id=REPLACE_WITH_SESSION_ID"
  params:
    - name: session_id
      value: REPLACE_WITH_SESSION_ID
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/backend/contact-session"
      method: GET
      params:
        - name: session_id
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "internal_id": "",
            "contacted_at": "",
            "platform_id": "",
            "admin_responded_at": "",
            "followup_tag": "",
            "requirement": "",
            "contact_type": "",
            "insight": "",
            "session_notes": "",
            "session_id": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/backend/contact-session"
      method: GET
      params:
        - name: session_id
          value: not-exist-session-id
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "contact session session_id=not-exist-session-id not found"
          }
