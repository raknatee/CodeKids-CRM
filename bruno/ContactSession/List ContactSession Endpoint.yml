  url: "{{baseUrl}}/api/backend/contact-session/list?skip=0&limit=20&internal_id=e4e5504b-c2f9-4699-ac07-098fd48c08dd"
  params:
    - name: skip
      value: "0"
      type: query
    - name: limit
      value: "20"
      type: query
