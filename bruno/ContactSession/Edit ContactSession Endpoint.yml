info:
  name: Edit ContactSession Endpoint
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/backend/contact-session?session_id=REPLACE_WITH_SESSION_ID"
  params:
    - name: session_id
      value: REPLACE_WITH_SESSION_ID
      type: query
  body:
    type: json
    data: |-
      {
        "internal_id": "e4e5504b-c2f9-4699-ac07-098fd48c08dd",
        "contacted_at": "2026-09-10T08:26:37.964Z",
        "platform_id": "",
        "admin_responded_at": "2026-09-10T09:00:00.000Z",
        "followup_tag": "1st follow-up",
        "requirement": "CONSULT_CODING",
        "contact_type": "OUTBOUND_FOLLOWUP",
        "insight": "",
        "session_notes": ""
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
