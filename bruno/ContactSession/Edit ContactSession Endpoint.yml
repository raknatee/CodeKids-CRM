  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/api/backend/contact-session"
      method: PUT
      params:
        - name: session_id
          value: not-exist-session-id
          type: query
      body:
        type: json
        data: |-
          {
            "internal_id": "",
            "contacted_at": ""
          }
    response:
      status: 404
      statusText: Not Found
