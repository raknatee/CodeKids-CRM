      body:
        type: json
        data: |-
          {
            "internal_id": "",
            "contacted_at": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "internal_id": "",
            "contacted_at": "",
            "platform_id": "",
